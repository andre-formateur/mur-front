<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Le Mur</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page auth">
    <p class="logo">🧱 Le Mur</p>

    <div class="card">
      <form id="login-form">
        <h1 class="form__title">Connexion</h1>

        <label>
          E-mail
          <input type="email" id="email" autocomplete="email" required>
        </label>

        <label>
          Mot de passe
          <input type="password" id="password" autocomplete="current-password" required>
        </label>

        <!-- Message d'erreur : invisible tant qu'il est vide -->
        <p id="error" class="error"></p>

        <button type="submit" class="btn">Se connecter</button>
      </form>
    </div>

    <p class="link">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
  </main>

  <script type="module" src="js/index.js"></script>
</body>
</html>
